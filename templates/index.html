<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Kishan Copilot</h1>

    <p>AI-powered smart farming assistant for farmers.</p>

    <div class="card">

        <p>Temperature: 34°C</p>
        <p>Rain Chances: 20%</p>
    </div>

    <div class="card">
        <h2>Crop Advisory</h2>
        <p>Recommended Crop: Wheat</p>

    </div>

    <div class="card">
        <h2>Disease Detection</h2>
        <p>Leaf appears healthy.</p>
    </div>

    <button onclick="voice()">Voice Assistant</button>

    <script>
        function voice() {
            alert("Voice Assistant Coming Soon");
        }
    </script>

</body>
